# Home Assistant kullanmadan, düz Docker ile çalıştırmak isteyenler için.
# HA üzerinde çalıştırıyorsanız bunu kullanmayın: depoyu eklenti olarak ekleyin
# (bkz. README) — aksi halde Home Assistant kurulumunuz "Unsupported" işaretlenir.
services:
  turkiye-il-notlari:
    build:
      context: ./turkiye-il-notlari
      dockerfile: Dockerfile
    container_name: turkiye-il-notlari
    ports:
      - "5000:5000"
    volumes:
      - il-notlari-data:/data
    environment:
      - TZ=Europe/Istanbul
    restart: unless-stopped

volumes:
  il-notlari-data:
