<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Türkiye İl Notları</title>

<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<meta name="color-scheme" content="light">

<!-- iPad / iPhone: ana ekrana eklenince tam ekran uygulama gibi açılsın -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="İl Notları">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" href="/static/icons/icon-192.png">

<style>
  :root{
    --bg:#eef1f5; --panel:#fff; --border:#d9dee6; --text:#1c2530; --muted:#6b7684;
    --accent:#2563eb; --danger:#dc2626; --sea:#dce7f2; --bos:#dfe4ea;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px);
    --safe-r:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box}
  html,body{height:100%;overscroll-behavior:none}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    -webkit-user-select:none;user-select:none;
  }

  /* ---------- üst çubuk ---------- */
  header{
    flex:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:var(--panel);border-bottom:1px solid var(--border);
    padding:10px calc(16px + var(--safe-r)) 10px calc(16px + var(--safe-l));
    padding-top:calc(10px + var(--safe-t));
  }
  header h1{font-size:17px;margin:0;font-weight:650;white-space:nowrap}
  .spacer{flex:1}
  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .count-pill{font-size:13px;color:var(--muted);white-space:nowrap}

  .seg{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
  .seg button{
    border:0;background:#fff;color:var(--muted);padding:8px 13px;
    font:inherit;font-size:13px;font-weight:600;cursor:pointer;
  }
  .seg button+button{border-left:1px solid var(--border)}
  .seg button.on{background:var(--accent);color:#fff}

  input,textarea{
    border:1px solid var(--border);border-radius:9px;padding:9px 11px;
    font:inherit;font-size:16px;background:#fff;color:var(--text);width:100%;
    -webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none;
  }
  input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
  #search{width:200px}
  .ghost{
    border:1px solid var(--border);background:#fff;color:var(--muted);
    border-radius:9px;padding:8px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;
  }
  .ghost:active{background:#eef1f5}

  /* ---------- harita ---------- */
  #stage{position:relative;flex:1;min-height:0}
  #map{
    width:100%;height:100%;display:block;background:var(--sea);
    cursor:grab;touch-action:none;
  }
  #map.dragging{cursor:grabbing}
  .il{stroke:#fff;stroke-width:.6;stroke-linejoin:round;cursor:pointer;transition:fill .18s}
  .il.secili{stroke:#111827;stroke-width:1.8}
  .rozet{
    font-size:9px;font-weight:700;fill:#fff;text-anchor:middle;pointer-events:none;
    paint-order:stroke;stroke:rgba(0,0,0,.45);stroke-width:2.4px;stroke-linejoin:round;
  }
  @media (hover:hover){ .il:hover{filter:brightness(1.12) saturate(1.08)} }

  #tooltip{
    position:fixed;pointer-events:none;z-index:40;display:none;
    background:rgba(17,24,39,.94);color:#fff;padding:5px 9px;border-radius:6px;
    font-size:12.5px;white-space:nowrap;transform:translate(-50%,-140%);
  }

  #legend{
    position:absolute;bottom:calc(14px + var(--safe-b));left:calc(14px + var(--safe-l));
    background:rgba(255,255,255,.94);border:1px solid var(--border);border-radius:9px;
    padding:9px 11px;font-size:12px;color:var(--muted);display:none;
  }
  #legend .bar{display:flex;height:9px;border-radius:3px;overflow:hidden;margin:6px 0 4px}
  #legend .bar span{flex:1}
  #legend .ends{display:flex;justify-content:space-between}

  #zoom{
    position:absolute;top:14px;right:calc(14px + var(--safe-r));
    display:flex;flex-direction:column;gap:6px;
  }
  #zoom button{
    width:42px;height:42px;border-radius:10px;border:1px solid var(--border);
    background:rgba(255,255,255,.95);color:var(--text);font-size:20px;line-height:1;
    cursor:pointer;font-weight:600;
  }
  #zoom button:active{background:#e9edf3}
  #stage.panel-acik #zoom{right:calc(414px + var(--safe-r));transition:right .24s ease}

  /* ---------- yan panel ---------- */
  #panel{
    position:absolute;top:0;right:0;bottom:0;width:400px;max-width:100%;
    background:var(--panel);border-left:1px solid var(--border);
    display:flex;flex-direction:column;transform:translateX(100%);
    transition:transform .24s ease;z-index:30;
    padding-right:var(--safe-r);padding-bottom:var(--safe-b);
    box-shadow:-8px 0 24px rgba(15,23,42,.06);
  }
  #panel.acik{transform:none}

  .panel-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px}
  .panel-head h2{margin:0;font-size:19px;font-weight:650}
  .plaka{
    display:inline-block;margin-top:4px;font-size:11.5px;color:var(--muted);
    border:1px solid var(--border);border-radius:5px;padding:1px 7px;font-variant-numeric:tabular-nums;
  }
  .kapat{
    border:0;background:transparent;font-size:26px;line-height:1;color:var(--muted);
    cursor:pointer;padding:2px 8px;margin:-4px -6px 0 0;
  }

  .panel-form{padding:12px 16px 14px;border-bottom:1px solid var(--border)}
  .etiket{display:block;font-size:12.5px;color:var(--muted);margin:0 0 4px;font-weight:600}
  .etiket .ops{font-weight:400;text-transform:none}
  .panel-form textarea{min-height:76px;resize:vertical;margin-bottom:0}
  .panel-form input{margin-bottom:11px}
  .panel-form .row{display:flex;align-items:center;gap:10px;margin-top:11px}
  .panel-form button{
    border:0;border-radius:9px;background:var(--accent);color:#fff;
    padding:11px 20px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;min-height:44px;
  }
  .panel-form button:disabled{opacity:.5}
  .hint{font-size:12px;color:var(--muted)}

  .panel-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 24px}
  .not{border-bottom:1px solid var(--border);padding:12px 0;display:flex;gap:10px;align-items:flex-start}
  .not:last-child{border-bottom:0}
  .not .govde{flex:1;min-width:0;-webkit-user-select:text;user-select:text}
  .not .kitap{font-weight:650;word-wrap:break-word}
  .not .metin{white-space:pre-wrap;word-wrap:break-word;color:#3b4757;margin-top:2px}
  .not .zaman{font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
  .not .sil{
    border:1px solid var(--border);background:#fff;color:var(--danger);
    border-radius:8px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer;flex:none;min-height:36px;
  }
  .not .sil:active{background:#fef2f2}
  .bos{color:var(--muted);font-size:14px;padding:18px 0}

  /* ---------- dokunmatik / dar ekran ---------- */
  @media (pointer:coarse){
    .seg button,.ghost{padding:11px 15px;min-height:44px}
    #zoom button{width:48px;height:48px}
  }
  /* iPad dikey ve dar ekranlar: panel alttan açılan sayfa olur */
  @media (max-width:900px){
    #search{width:150px}
    #panel{
      width:100%;top:auto;height:66%;border-left:0;border-top:1px solid var(--border);
      transform:translateY(100%);border-radius:16px 16px 0 0;
      box-shadow:0 -8px 24px rgba(15,23,42,.10);
    }
    #panel.acik{transform:none}
    #stage.panel-acik #zoom{right:calc(14px + var(--safe-r))}
  }
  @media (max-width:620px){
    header h1{font-size:15px}
    #search{width:120px}
    .seg button{padding:9px 10px;font-size:12.5px}
  }
</style>
</head>
<body>

<header>
  <h1>Türkiye İl Notları</h1>
  <span class="count-pill" id="ozet">yükleniyor…</span>
  <div class="spacer"></div>
  <div class="toolbar">
    <input type="search" id="search" placeholder="İl ara…" autocomplete="off" list="il-listesi" enterkeyhint="search">
    <datalist id="il-listesi"></datalist>
    <div class="seg" role="group" aria-label="Renklendirme">
      <button id="mod-il" class="on" type="button">Her il farklı renk</button>
      <button id="mod-isi" type="button">Kitap yoğunluğu</button>
    </div>
    <button class="ghost" id="sifirla" type="button">Sıfırla</button>
  </div>
</header>

<div id="stage">
  <svg id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Türkiye il haritası"></svg>

  <div id="zoom">
    <button type="button" id="z-in"  aria-label="Yakınlaştır">+</button>
    <button type="button" id="z-out" aria-label="Uzaklaştır">−</button>
  </div>

  <div id="legend">
    <div>Kitap yoğunluğu</div>
    <div class="bar" id="legend-bar"></div>
    <div class="ends"><span>0</span><span id="legend-max">0</span></div>
  </div>

  <aside id="panel" aria-live="polite">
    <div class="panel-head">
      <div style="flex:1">
        <h2 id="p-il">—</h2>
        <span class="plaka" id="p-plaka">—</span>
      </div>
      <button class="kapat" id="p-kapat" type="button" aria-label="Kapat">×</button>
    </div>

    <div class="panel-form">
      <label class="etiket" for="p-kitap">Kitap adı</label>
      <input type="text" id="p-kitap" list="kitap-listesi" placeholder="örn. Tutunamayanlar"
             autocomplete="off" autocapitalize="words" enterkeyhint="next">
      <datalist id="kitap-listesi"></datalist>

      <label class="etiket" for="p-metin">Not <span class="ops">(isteğe bağlı)</span></label>
      <textarea id="p-metin" placeholder="Bu kitapla ilgili notunuz…"></textarea>

      <div class="row">
        <button id="p-ekle" type="button">Ekle</button>
        <span class="hint">Ctrl + Enter ile de kaydedebilirsiniz</span>
      </div>
    </div>

    <div class="panel-list" id="p-liste"></div>
  </aside>
</div>

<div id="tooltip"></div>

<script>
(function () {
  "use strict";

  var svgNS = "http://www.w3.org/2000/svg";
  var map = document.getElementById("map");
  var tooltip = document.getElementById("tooltip");
  var panel = document.getElementById("panel");
  var legend = document.getElementById("legend");

  var iller = [];
  var sayilar = {};
  var seciliIl = null;
  var mod = "il";
  var viewBox = null, baseViewBox = null;
  var icerikW = 0, icerikH = 0;      // haritanın kendi ölçüleri
  var kullaniciOynatti = false;      // kullanıcı yakınlaştırdı/kaydırdı mı

  // ---------- projeksiyon ----------
  function proj(lon, lat) {
    return [lon * Math.PI / 180, Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360))];
  }

  function ringler(geom) {
    if (geom.type === "Polygon") return geom.coordinates;
    var out = [];
    geom.coordinates.forEach(function (poly) { poly.forEach(function (r) { out.push(r); }); });
    return out;
  }

  // ---------- renkler ----------
  var BOS_RENK = "#dfe4ea";

  function ilRengi(plaka) {
    var h = (plaka * 137.508) % 360;
    var s = 55 + (plaka * 7) % 18;
    var l = 58 + (plaka * 11) % 14;
    return "hsl(" + h.toFixed(1) + "," + s + "%," + l + "%)";
  }

  function isiRengi(adet, enCok) {
    var t = enCok > 1 ? (adet - 1) / (enCok - 1) : 1;
    return "hsl(214,72%," + (84 - t * 44).toFixed(1) + "%)";
  }

  function boya() {
    var enCok = 0;
    for (var k in sayilar) if (sayilar[k] > enCok) enCok = sayilar[k];

    iller.forEach(function (il) {
      var adet = sayilar[il.ad] || 0;
      // Kaydı olmayan il gri kalır; ilk kitap girilince ilin kendi rengine boyanır.
      il.el.setAttribute("fill", !adet ? BOS_RENK
        : (mod === "il" ? ilRengi(il.plaka) : isiRengi(adet, enCok)));
      if (adet > 0) { il.rozet.textContent = adet; il.rozet.style.display = ""; }
      else { il.rozet.style.display = "none"; }
    });

    legend.style.display = mod === "isi" ? "block" : "none";
    document.getElementById("legend-max").textContent = enCok;

    var toplam = 0, illiSayi = 0;
    for (var j in sayilar) { toplam += sayilar[j]; illiSayi++; }
    document.getElementById("ozet").textContent =
      toplam + " kayıt · " + illiSayi + "/81 il renkli";
  }

  // ---------- harita ----------
  function haritayiKur(geo) {
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    var hazir = [];

    geo.features.forEach(function (f) {
      var parcalar = [];
      ringler(f.geometry).forEach(function (ring) {
        var pts = ring.map(function (c) { return proj(c[0], c[1]); });
        pts.forEach(function (p) {
          if (p[0] < minX) minX = p[0];
          if (p[0] > maxX) maxX = p[0];
          if (p[1] < minY) minY = p[1];
          if (p[1] > maxY) maxY = p[1];
        });
        parcalar.push(pts);
      });
      hazir.push({ ad: f.properties.name, plaka: f.properties.number, parcalar: parcalar });
    });

    var W = 1000;
    var olcek = W / (maxX - minX);
    var H = (maxY - minY) * olcek;

    var gIller = document.createElementNS(svgNS, "g");
    var gRozet = document.createElementNS(svgNS, "g");

    hazir.forEach(function (il) {
      var d = "", merkez = null, enBuyukAlan = -1;

      il.parcalar.forEach(function (pts) {
        var aX = Infinity, aY = Infinity, bX = -Infinity, bY = -Infinity;
        d += "M";
        pts.forEach(function (p, i) {
          var x = (p[0] - minX) * olcek, y = (maxY - p[1]) * olcek;
          d += (i ? "L" : "") + x.toFixed(2) + " " + y.toFixed(2);
          if (x < aX) aX = x; if (x > bX) bX = x;
          if (y < aY) aY = y; if (y > bY) bY = y;
        });
        d += "Z";
        var alan = (bX - aX) * (bY - aY);
        if (alan > enBuyukAlan) { enBuyukAlan = alan; merkez = [(aX + bX) / 2, (aY + bY) / 2]; }
      });

      var path = document.createElementNS(svgNS, "path");
      path.setAttribute("d", d);
      path.setAttribute("class", "il");
      path.dataset.il = il.ad;
      path.dataset.plaka = il.plaka;
      gIller.appendChild(path);

      var rozet = document.createElementNS(svgNS, "text");
      rozet.setAttribute("x", merkez[0].toFixed(1));
      rozet.setAttribute("y", (merkez[1] + 3).toFixed(1));
      rozet.setAttribute("class", "rozet");
      rozet.style.display = "none";
      gRozet.appendChild(rozet);

      iller.push({ ad: il.ad, plaka: il.plaka, el: path, rozet: rozet, cx: merkez[0], cy: merkez[1] });
    });

    map.appendChild(gIller);
    map.appendChild(gRozet);

    icerikW = W; icerikH = H;
    temelHesapla();
    viewBox = Object.assign({}, baseViewBox);
    uygulaViewBox();

    var dl = document.getElementById("il-listesi");
    iller.slice().sort(function (a, b) { return a.ad.localeCompare(b.ad, "tr"); })
      .forEach(function (il) {
        var o = document.createElement("option");
        o.value = il.ad;
        dl.appendChild(o);
      });
  }

  // viewBox'ı kabın en-boy oranına oturtur; böylece SVG'de boş bant kalmaz ve
  // ekran <-> harita koordinat dönüşümü birebir olur.
  function temelHesapla() {
    var r = map.getBoundingClientRect();
    var oran = (r.width && r.height) ? r.width / r.height : icerikW / icerikH;
    var payW = icerikW * 1.03, payH = icerikH * 1.10;
    var w = payW, h = w / oran;
    if (h < payH) { h = payH; w = h * oran; }
    baseViewBox = { x: (icerikW - w) / 2, y: (icerikH - h) / 2, w: w, h: h };
  }

  function uygulaViewBox() {
    map.setAttribute("viewBox",
      viewBox.x.toFixed(2) + " " + viewBox.y.toFixed(2) + " " +
      viewBox.w.toFixed(2) + " " + viewBox.h.toFixed(2));
  }

  function genislikSinirla(w) {
    return Math.min(baseViewBox.w * 1.6, Math.max(baseViewBox.w * 0.05, w));
  }

  // Verilen ekran noktasını sabit tutarak yakınlaştır/uzaklaştır
  function olcekle(k, clientX, clientY) {
    var r = map.getBoundingClientRect();
    var fx = (clientX - r.left) / r.width;
    var fy = (clientY - r.top) / r.height;
    var sabitX = viewBox.x + fx * viewBox.w;
    var sabitY = viewBox.y + fy * viewBox.h;
    var yeniW = genislikSinirla(viewBox.w * k);
    var gercek = yeniW / viewBox.w;
    viewBox.w = yeniW;
    viewBox.h *= gercek;
    viewBox.x = sabitX - fx * viewBox.w;
    viewBox.y = sabitY - fy * viewBox.h;
    uygulaViewBox();
  }

  // ---------- fare tekerleği ----------
  map.addEventListener("wheel", function (e) {
    e.preventDefault();
    kullaniciOynatti = true;
    olcekle(e.deltaY < 0 ? 0.85 : 1 / 0.85, e.clientX, e.clientY);
  }, { passive: false });

  // ---------- dokunma: tek parmak kaydırma, çift parmak pinch ----------
  var isaretciler = new Map();
  var pan = null, pinch = null, pinchOldu = false;

  function ikiParmak() {
    var a = [];
    isaretciler.forEach(function (v) { a.push(v); });
    var dx = a[0].x - a[1].x, dy = a[0].y - a[1].y;
    return {
      mesafe: Math.max(1, Math.hypot(dx, dy)),
      ortaX: (a[0].x + a[1].x) / 2,
      ortaY: (a[0].y + a[1].y) / 2
    };
  }

  map.addEventListener("pointerdown", function (e) {
    try { map.setPointerCapture(e.pointerId); } catch (hata) { /* önemsiz */ }
    isaretciler.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (isaretciler.size === 1) {
      pinchOldu = false;
      // Hedefi burada saklıyoruz: setPointerCapture sonrası pointerup'ın hedefi
      // artık il yolu değil, SVG'nin kendisi oluyor.
      pan = { x: e.clientX, y: e.clientY, vx: viewBox.x, vy: viewBox.y,
              tasindi: false, hedef: e.target };
    } else if (isaretciler.size === 2) {
      pan = null;
      pinchOldu = true;
      var s = ikiParmak();
      var r = map.getBoundingClientRect();
      pinch = {
        mesafe: s.mesafe,
        svgX: viewBox.x + (s.ortaX - r.left) / r.width * viewBox.w,
        svgY: viewBox.y + (s.ortaY - r.top) / r.height * viewBox.h,
        w: viewBox.w, h: viewBox.h
      };
    }
  });

  map.addEventListener("pointermove", function (e) {
    if (!isaretciler.has(e.pointerId)) return;
    isaretciler.set(e.pointerId, { x: e.clientX, y: e.clientY });
    var r = map.getBoundingClientRect();

    if (pinch && isaretciler.size === 2) {
      var s = ikiParmak();
      kullaniciOynatti = true;
      var yeniW = genislikSinirla(pinch.w * (pinch.mesafe / s.mesafe));
      var oran = yeniW / pinch.w;
      viewBox.w = yeniW;
      viewBox.h = pinch.h * oran;
      viewBox.x = pinch.svgX - (s.ortaX - r.left) / r.width * viewBox.w;
      viewBox.y = pinch.svgY - (s.ortaY - r.top) / r.height * viewBox.h;
      uygulaViewBox();
      return;
    }

    if (pan) {
      if (Math.abs(e.clientX - pan.x) > 4 || Math.abs(e.clientY - pan.y) > 4) {
        pan.tasindi = true; kullaniciOynatti = true;
      }
      viewBox.x = pan.vx - (e.clientX - pan.x) / r.width * viewBox.w;
      viewBox.y = pan.vy - (e.clientY - pan.y) / r.height * viewBox.h;
      uygulaViewBox();
      if (!map.classList.contains("dragging")) map.classList.add("dragging");
    }
  });

  function isaretciBitti(e) {
    isaretciler.delete(e.pointerId);
    if (isaretciler.size < 2) pinch = null;

    if (isaretciler.size === 0) {
      map.classList.remove("dragging");
      var p = pan;
      pan = null;
      if (p && !p.tasindi && !pinchOldu &&
          p.hedef && p.hedef.classList && p.hedef.classList.contains("il")) {
        ilSec(p.hedef.dataset.il, +p.hedef.dataset.plaka);
      }
    }
  }
  map.addEventListener("pointerup", isaretciBitti);
  map.addEventListener("pointercancel", isaretciBitti);

  document.getElementById("z-in").addEventListener("click", function () {
    var r = map.getBoundingClientRect();
    kullaniciOynatti = true;
    olcekle(0.7, r.left + r.width / 2, r.top + r.height / 2);
  });
  document.getElementById("z-out").addEventListener("click", function () {
    var r = map.getBoundingClientRect();
    kullaniciOynatti = true;
    olcekle(1 / 0.7, r.left + r.width / 2, r.top + r.height / 2);
  });
  document.getElementById("sifirla").addEventListener("click", function () {
    temelHesapla();
    kullaniciOynatti = false;
    animasyonlaGit(Object.assign({}, baseViewBox));
  });

  // Ekran döndürüldüğünde / boyut değiştiğinde görünümü koru
  var boyutZaman = null;
  window.addEventListener("resize", function () {
    if (!baseViewBox) return;
    clearTimeout(boyutZaman);
    boyutZaman = setTimeout(function () {
      var r = map.getBoundingClientRect();
      if (!r.width || !r.height) return;
      var mx = viewBox.x + viewBox.w / 2, my = viewBox.y + viewBox.h / 2;
      temelHesapla();
      if (!kullaniciOynatti) {
        viewBox = Object.assign({}, baseViewBox);
      } else {
        viewBox.h = viewBox.w / (r.width / r.height);
        viewBox.x = mx - viewBox.w / 2;
        viewBox.y = my - viewBox.h / 2;
      }
      uygulaViewBox();
    }, 120);
  });

  // ---------- yumuşak geçiş ----------
  var animId = null;
  var azHareket = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function animasyonlaGit(hedef, sure) {
    if (animId) { cancelAnimationFrame(animId); animId = null; }

    // Sekme arka plandayken rAF çalışmaz; hareket azaltma açıksa da animasyon istemeyiz.
    if (azHareket || document.hidden) {
      viewBox = { x: hedef.x, y: hedef.y, w: hedef.w, h: hedef.h };
      uygulaViewBox();
      return;
    }

    var bas = Object.assign({}, viewBox);
    var t0 = performance.now();
    sure = sure || 280;
    function adim(t) {
      var k = Math.min(1, (t - t0) / sure);
      var e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;   // easeInOutQuad
      viewBox.x = bas.x + (hedef.x - bas.x) * e;
      viewBox.y = bas.y + (hedef.y - bas.y) * e;
      viewBox.w = bas.w + (hedef.w - bas.w) * e;
      viewBox.h = bas.h + (hedef.h - bas.h) * e;
      uygulaViewBox();
      if (k < 1) animId = requestAnimationFrame(adim); else animId = null;
    }
    animId = requestAnimationFrame(adim);
  }

  // Seçilen il panelin altında kalıyorsa görünür alana kaydır.
  // Panelin yerini transform'dan bağımsız hesaplıyoruz; açılış animasyonu
  // sürerken getBoundingClientRect() henüz hedef konumu vermiyor.
  function panelIcinKaydir(cx, cy) {
    var r = map.getBoundingClientRect();
    if (!r.width || !panel.classList.contains("acik")) return;

    var dar = window.innerWidth <= 900;
    var panelUst = dar ? r.bottom - panel.offsetHeight : r.top;
    var panelSol = dar ? r.left : r.right - panel.offsetWidth;

    var ekranX = r.left + (cx - viewBox.x) / viewBox.w * r.width;
    var ekranY = r.top + (cy - viewBox.y) / viewBox.h * r.height;

    var pay = 16;
    var gizli = ekranX > panelSol - pay && ekranY > panelUst - pay;
    if (!gizli) return;

    var fx, fy;
    if (dar) {
      fx = 0.5;
      fy = Math.max(0.12, Math.min(0.5, ((panelUst - r.top) / 2) / r.height));
    } else {
      fx = Math.max(0.12, ((panelSol - r.left) / 2) / r.width);
      fy = 0.5;
    }
    animasyonlaGit({ x: cx - fx * viewBox.w, y: cy - fy * viewBox.h, w: viewBox.w, h: viewBox.h });
  }

  // ---------- ipucu balonu ----------
  map.addEventListener("mousemove", function (e) {
    var t = e.target;
    if (t.classList && t.classList.contains("il")) {
      var ad = t.dataset.il, adet = sayilar[ad] || 0;
      tooltip.textContent = ad + " · " + (adet ? adet + " kitap" : "kayıt yok");
      tooltip.style.display = "block";
      tooltip.style.left = e.clientX + "px";
      tooltip.style.top = e.clientY + "px";
    } else {
      tooltip.style.display = "none";
    }
  });
  map.addEventListener("mouseleave", function () { tooltip.style.display = "none"; });

  // ---------- panel ----------
  function ilSec(ad, plaka) {
    seciliIl = { ad: ad, plaka: plaka };
    iller.forEach(function (il) { il.el.classList.toggle("secili", il.ad === ad); });
    document.getElementById("p-il").textContent = ad;
    document.getElementById("p-plaka").textContent = "Plaka " + String(plaka).padStart(2, "0");
    document.getElementById("p-kitap").value = "";
    document.getElementById("p-metin").value = "";
    panel.classList.add("acik");
    document.getElementById("stage").classList.add("panel-acik");
    notlariYukle(ad);

    var kayit = iller.filter(function (i) { return i.ad === ad; })[0];
    if (kayit) {
      // panel genişliği/yüksekliği yerleşsin diye bir kare bekle
      requestAnimationFrame(function () { panelIcinKaydir(kayit.cx, kayit.cy); });
    }
  }

  function panelKapat() {
    panel.classList.remove("acik");
    document.getElementById("stage").classList.remove("panel-acik");
    seciliIl = null;
    iller.forEach(function (il) { il.el.classList.remove("secili"); });
  }
  document.getElementById("p-kapat").addEventListener("click", panelKapat);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") panelKapat(); });

  function notlariYukle(ad) {
    var liste = document.getElementById("p-liste");
    liste.textContent = "";
    var bekle = document.createElement("p");
    bekle.className = "bos";
    bekle.textContent = "Yükleniyor…";
    liste.appendChild(bekle);

    fetch("/api/notes?province=" + encodeURIComponent(ad))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!seciliIl || seciliIl.ad !== d.province) return;
        notlariCiz(d.notes);
      })
      .catch(function () { liste.textContent = ""; });
  }

  function notlariCiz(notlar) {
    var liste = document.getElementById("p-liste");
    liste.textContent = "";

    if (!notlar.length) {
      var bos = document.createElement("p");
      bos.className = "bos";
      bos.textContent = "Bu il için henüz kayıt yok. Yukarıdan ilk kitabı ekleyin.";
      liste.appendChild(bos);
      return;
    }

    notlar.forEach(function (n) {
      var satir = document.createElement("div");
      satir.className = "not";

      var govde = document.createElement("div");
      govde.className = "govde";

      var kitap = document.createElement("div");
      kitap.className = "kitap";
      kitap.textContent = n.book || "(kitap adı yok)";
      govde.appendChild(kitap);

      if (n.text) {
        var metin = document.createElement("div");
        metin.className = "metin";
        metin.textContent = n.text;
        govde.appendChild(metin);
      }

      var zaman = document.createElement("div");
      zaman.className = "zaman";
      zaman.textContent = n.timestamp;
      govde.appendChild(zaman);

      var sil = document.createElement("button");
      sil.className = "sil";
      sil.type = "button";
      sil.textContent = "Sil";
      sil.addEventListener("click", function () {
        if (!confirm("“" + (n.book || "Bu kayıt") + "” silinsin mi?")) return;
        fetch("/api/notes/" + n.id, { method: "DELETE" })
          .then(function (r) { return r.json(); })
          .then(function () {
            satir.remove();
            sayilar[n.province] = Math.max(0, (sayilar[n.province] || 1) - 1);
            if (!sayilar[n.province]) delete sayilar[n.province];
            boya();
            if (!liste.querySelector(".not")) notlariCiz([]);
          });
      });

      satir.appendChild(govde);
      satir.appendChild(sil);
      liste.appendChild(satir);
    });
  }

  function kitaplariYenile() {
    fetch("/api/books").then(function (r) { return r.json(); }).then(function (adlar) {
      var dl = document.getElementById("kitap-listesi");
      dl.textContent = "";
      adlar.forEach(function (ad) {
        var o = document.createElement("option");
        o.value = ad;
        dl.appendChild(o);
      });
    }).catch(function () {});
  }

  function notEkle() {
    if (!seciliIl) return;
    var kitapAlani = document.getElementById("p-kitap");
    var metinAlani = document.getElementById("p-metin");
    var kitap = kitapAlani.value.trim();
    var metin = metinAlani.value.trim();

    if (!kitap) { kitapAlani.focus(); return; }

    var dugme = document.getElementById("p-ekle");
    dugme.disabled = true;

    fetch("/api/notes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        province: seciliIl.ad, province_code: seciliIl.plaka,
        book: kitap, text: metin
      })
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        dugme.disabled = false;
        if (!res.ok) { alert(res.d.error || "Kayıt eklenemedi."); return; }
        kitapAlani.value = "";
        metinAlani.value = "";
        sayilar[seciliIl.ad] = (sayilar[seciliIl.ad] || 0) + 1;
        boya();
        notlariYukle(seciliIl.ad);
        kitaplariYenile();
        kitapAlani.focus();
      })
      .catch(function () { dugme.disabled = false; alert("Sunucuya ulaşılamadı."); });
  }

  document.getElementById("p-ekle").addEventListener("click", notEkle);
  document.getElementById("p-kitap").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); document.getElementById("p-metin").focus(); }
  });
  document.getElementById("p-metin").addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") notEkle();
  });

  // ---------- mod ----------
  function modSec(yeni) {
    mod = yeni;
    document.getElementById("mod-il").classList.toggle("on", yeni === "il");
    document.getElementById("mod-isi").classList.toggle("on", yeni === "isi");
    boya();
  }
  document.getElementById("mod-il").addEventListener("click", function () { modSec("il"); });
  document.getElementById("mod-isi").addEventListener("click", function () { modSec("isi"); });

  // ---------- arama ----------
  document.getElementById("search").addEventListener("change", function () {
    var q = this.value.trim().toLocaleLowerCase("tr");
    if (!q) return;
    var bulunan = iller.filter(function (il) {
      return il.ad.toLocaleLowerCase("tr").indexOf(q) === 0;
    })[0] || iller.filter(function (il) {
      return il.ad.toLocaleLowerCase("tr").indexOf(q) !== -1;
    })[0];
    if (!bulunan) return;

    var w = baseViewBox.w * 0.28;
    var h = w * baseViewBox.h / baseViewBox.w;
    kullaniciOynatti = true;
    animasyonlaGit({ x: bulunan.cx - w / 2, y: bulunan.cy - h / 2, w: w, h: h });
    ilSec(bulunan.ad, bulunan.plaka);
    this.blur();
  });

  // ---------- efsane ----------
  (function () {
    var bar = document.getElementById("legend-bar");
    for (var i = 0; i <= 10; i++) {
      var s = document.createElement("span");
      s.style.background = i === 0 ? BOS_RENK : "hsl(214,72%," + (84 - (i / 10) * 44) + "%)";
      bar.appendChild(s);
    }
  })();

  // ---------- başlat ----------
  Promise.all([
    fetch("/static/tr-cities.json").then(function (r) { return r.json(); }),
    fetch("/api/summary").then(function (r) { return r.json(); })
  ]).then(function (res) {
    haritayiKur(res[0]);
    sayilar = res[1];
    boya();
    kitaplariYenile();
  }).catch(function (e) {
    document.getElementById("ozet").textContent = "Harita yüklenemedi: " + e.message;
  });

  // ---------- PWA ----------
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").catch(function () {
        /* HTTPS olmayan adreste kayıt olmaz; uygulama yine de çalışır. */
      });
    });
  }
})();
</script>
</body>
</html>
